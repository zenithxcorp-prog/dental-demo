<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smile Arc Dental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a43;--ink2:#53687c;--enamel:#f6faf9;--mint:#d3eee8;--teal:#1b8a80;--gum:#ee7f86;--line:#d9e5e3;--white:#fff;--wa:#1f9d55;--gold:#f59e0b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Figtree,system-ui,sans-serif;background:#e1eae8;color:var(--ink);display:flex;justify-content:center}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;font-weight:700}
button,input,a{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--enamel);padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 115px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.sub{color:var(--ink2);font-size:14px}
h1{font-size:25px;line-height:1.15}
h2{font-size:19px;margin:24px 0 12px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--teal);flex-shrink:0}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:40px;height:40px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:600;color:var(--teal);flex-shrink:0;font-size:14px}
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden;min-height:190px}
.hero .sub{color:#9fc3c0}
.hero h3{font-size:24px;margin:6px 0 4px;max-width:225px;line-height:1.12}
.hero p{color:#cfe3e1;font-size:15px}
.hero svg.big{position:absolute;right:-26px;top:14px;width:170px;height:170px;fill:none;stroke:var(--mint);stroke-width:.5;opacity:.9}
.hero svg.big path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-btns .btn{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--mint);color:var(--ink);font-weight:600;padding:11px 16px;border-radius:14px;margin-top:16px;font-size:14px}
.btn.solid{background:var(--teal);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.outline-light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);margin-top:0;padding:9px 14px;font-size:14px}
.btn.danger{color:#c4474f;border-color:#f3cdd0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.trust div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.trust b{display:block;font-size:14px;color:var(--ink)}
.trust span{font-size:11.5px;color:var(--ink2)}
.trust .star{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.svc b{display:block;font-size:15px}
.svc span{color:var(--ink2);font-size:13px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.doc{flex:0 0 150px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px}
.doc .av{width:46px;height:46px;margin-bottom:10px}
.doc b{font-size:15px;display:block}
.doc span{font-size:13px;color:var(--ink2)}
.loc-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:22px}
.loc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.loc-head b{font-size:16px}
.open-pill{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:#e6f7ef;color:#15803d}
.loc-card p{font-size:14px;color:var(--ink2);line-height:1.45;margin-bottom:12px}
.loc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc-actions .btn{margin-top:0;width:100%}
.tip{background:var(--mint);border-radius:18px;padding:16px;margin-top:16px;font-size:14.5px;line-height:1.45}
.tip b{display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font-size:14px}
.chip[aria-pressed=true],.pick[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.pick .av{width:38px;height:38px;font-size:13px}
.pick small{display:block;opacity:.7;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day{flex:0 0 58px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--white);text-align:center}
.day small{display:block;font-size:12px;opacity:.7}
.day b{font-size:19px}
.day[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--white);font-size:14px}
.slot[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.slot:disabled{background:transparent;text-decoration:line-through;opacity:.4;cursor:not-allowed}
.form-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--enamel);font-size:15px}
.field input:focus{border-color:var(--teal);background:var(--white);outline:none}
.bar{position:sticky;bottom:86px;margin-top:22px;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(15,42,67,.18)}
.bar small{display:block;color:#9fc3c0;font-size:12px}
.bar .btn{margin:0;padding:11px 15px;font-size:14px;white-space:nowrap}
.visit{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.visit .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.visit b{font-size:16px}
.visit p{color:var(--ink2);font-size:14px;margin:4px 0 12px;line-height:1.45}
.visit .actions{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--mint);color:var(--teal);font-weight:600}
.tag.done{background:#eef1f1;color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:30px 10px}
.brush{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brush button{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center}
.brush button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.brush b{display:block;font-size:17px}
.streak{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.streak .n{font-size:44px;line-height:1}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#2c4a66}
.dots i.on{background:var(--mint)}
.list{list-style:none;padding:0}
.list li{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:15px;line-height:1.4}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink2);padding:6px 0;border-radius:14px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--teal);font-weight:600}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero svg.big path{stroke-dashoffset:0}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Main"></nav>
<div id="toast" role="status"></div>

<script>
// === CLINIC SETTINGS (URL से भी बदल सकते हैं: ?clinic=Name&wa=9198...&addr=...&map=...) ===
const qp = new URLSearchParams(location.search);
const waNum = (qp.get('wa') || '919876543210').replace(/\D/g, '');
const CLINIC_CONFIG = {
  name: qp.get('clinic') || 'Smile Arc Dental',
  whatsapp: waNum,
  phone: '+' + (qp.get('phone') || waNum).replace(/\D/g, ''),
  address: qp.get('addr') || '2nd Floor, City Center, Main Road',
  timings: qp.get('time') || 'Mon–Sat: 10:00 AM – 8:00 PM',
  mapUrl: qp.get('map') || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(qp.get('clinic') || 'Smile Arc Dental')),
  rating: qp.get('rating') || '4.9',
  patients: qp.get('patients') || '500+'
};
document.title = CLINIC_CONFIG.name;

const STORAGE_KEY = 'smile_arc_dental_v2';
const TOOTH = 'M7.5 3C5 3 3.5 5 3.5 7.5c0 2 .8 3.4 1.3 5.2.6 2.3.6 6.3 2.2 6.3 1.4 0 1.2-4 2.3-4.8.4-.3 1.2-.3 1.6 0 1.1.8.9 4.8 2.3 4.8 1.6 0 1.6-4 2.2-6.3.5-1.8 1.3-3.2 1.3-5.2C20.5 5 19 3 16.5 3c-1.7 0-2.7.9-4.5.9S9.2 3 7.5 3z';
const ICON = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M12 11v6M9 14h6"/>',
  visits:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  care:'<path d="'+TOOTH+'"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>'
};
const NAV = [['home','Home'],['book','Book'],['visits','Visits'],['care','Care']];
const SVC = [
  {id:'chk',n:'Check-up',p:300,m:20},{id:'cln',n:'Cleaning',p:800,m:40},
  {id:'whi',n:'Whitening',p:4500,m:60},{id:'brc',n:'Braces consult',p:500,m:30},
  {id:'rct',n:'Root canal',p:3500,m:60},{id:'imp',n:'Implant consult',p:600,m:30}
];
const DOC = [
  {id:'d1',n:'Dr. Sana Qureshi',r:'General dentist'},
  {id:'d2',n:'Dr. Meera Iyer',r:'Orthodontist'},
  {id:'d3',n:'Dr. Rohan Kapoor',r:'Endodontist'}
];
const TIMES = ['10:00','10:30','11:00','11:30','12:00','12:30','15:00','15:30','16:00','16:30','17:00','17:30'];
const TIPS = [
  'Brush for two full minutes, twice a day, with a soft brush.',
  'Floss once a day before bed. It reaches what the brush cannot.',
  'Change your toothbrush every three months or when bristles splay.',
  'Wait 30 minutes after acidic food or drinks before brushing.'
];

const addDays = n => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d; };
const fmtD = d => d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const fmtT = t => { const h = +t.slice(0,2); return (h%12||12)+':'+t.slice(3)+(h<12?' am':' pm'); };
const sv = id => SVC.find(x=>x.id===id);
const dc = id => DOC.find(x=>x.id===id);
const ini = n => (n||'P').replace(/^Dr\.\s*/i,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || 'PT';
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const taken = (i,t) => (i*7 + TIMES.indexOf(t)*3) % 5 === 0;

function loadState() {
  const fallback = {
    v: 'home', id: 2,
    user: { name: '', phone: '' },
    b: { s: null, d: null, day: 1, t: null, name: '', phone: '', note: '' },
    am: true, pm: false,
    appts: [
      {id:1, s:'cln', d:'d1', date:addDays(2), t:'11:00', up:true, name:'Aarav', phone:'9876543210', note:''},
      {id:2, s:'chk', d:'d1', date:addDays(-34), t:'10:30', up:false, name:'Aarav', phone:'9876543210', note:''}
    ]
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fallback;
    const saved = JSON.parse(raw);
    return {
      ...fallback,
      id: saved.id || fallback.id,
      user: saved.user || fallback.user,
      am: typeof saved.am === 'boolean' ? saved.am : true,
      pm: typeof saved.pm === 'boolean' ? saved.pm : false,
      b: { ...fallback.b, name: saved.user?.name || '', phone: saved.user?.phone || '' },
      appts: Array.isArray(saved.appts)
        ? saved.appts.map(a => ({ ...a, date: new Date(a.date) }))
        : fallback.appts
    };
  } catch { return fallback; }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      id: st.id, user: st.user, am: st.am, pm: st.pm,
      appts: st.appts.map(a => ({ ...a, date: a.date.toISOString() }))
    }));
  } catch {}
}

const st = loadState();

function isBookingReady() {
  const b = st.b;
  return Boolean(b.s && b.d && b.t && b.name.trim().length >= 2 && b.phone.replace(/\D/g,'').length >= 10);
}

function openWhatsApp(appt) {
  const lines = [
    `Hello *${CLINIC_CONFIG.name}*,`,
    `I would like to confirm my dental appointment:`,
    ``,
    `*Patient:* ${appt.name}`,
    `*Phone:* ${appt.phone}`,
    `*Treatment:* ${sv(appt.s).n} (Est. Rs ${sv(appt.s).p})`,
    `*Dentist:* ${dc(appt.d).n}`,
    `*Date:* ${fmtD(appt.date)}`,
    `*Time:* ${fmtT(appt.t)}`
  ];
  if (appt.note && appt.note.trim()) lines.push(`*Note:* ${appt.note.trim()}`);
  window.open(`https://wa.me/${CLINIC_CONFIG.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank', 'noopener');
}

function hero() {
  const a = st.appts.filter(x=>x.up).sort((x,y)=>x.date-y.date)[0];
  const art = '<svg class="big" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="'+TOOTH+'"/></svg>';
  if (!a) return '<section class="hero">'+art+'<p class="sub">Painless Dental Care</p><h3>Book your visit in 30 seconds</h3><p>No waiting in line. Instant WhatsApp confirmation.</p><div class="hero-btns"><button class="btn" data-a="nav" data-v="book">Book Appointment</button><a class="btn outline-light" href="tel:'+CLINIC_CONFIG.phone+'">Emergency Call</a></div></section>';
  return '<section class="hero">'+art+'<p class="sub">Next visit</p><h3>'+sv(a.s).n+' with '+dc(a.d).n+'</h3><p>'+fmtD(a.date)+', '+fmtT(a.t)+'</p><div class="hero-btns"><button class="btn" data-a="nav" data-v="visits">View details</button><a class="btn outline-light" href="tel:'+CLINIC_CONFIG.phone+'">Call Clinic</a></div></section>';
}

function home() {
  const h = new Date().getHours(), g = h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const displayName = st.user.name ? ', ' + esc(st.user.name.split(' ')[0]) : '';
  return '<header class="top"><div><p class="sub">'+g+displayName+'</p><h1>'+esc(CLINIC_CONFIG.name)+'</h1></div><div class="top-actions"><a class="icon-btn" href="tel:'+CLINIC_CONFIG.phone+'" aria-label="Call clinic"><svg viewBox="0 0 24 24">'+ICON.phone+'</svg></a><div class="av">'+ini(st.user.name || CLINIC_CONFIG.name)+'</div></div></header>'+
  hero()+
  '<div class="trust"><div><b><span class="star">★</span> '+esc(CLINIC_CONFIG.rating)+'</b><span>Google Rating</span></div><div><b>'+esc(CLINIC_CONFIG.patients)+'</b><span>Happy Smiles</span></div><div><b>100%</b><span>Sterile &amp; Safe</span></div></div>'+
  '<h2>Treatments</h2><div class="grid">'+SVC.map(s=>'<button class="svc" data-a="quick" data-id="'+s.id+'"><b>'+s.n+'</b><span>From Rs '+s.p+' / '+s.m+' min</span></button>').join('')+'</div>'+
  '<h2>Our dentists</h2><div class="row">'+DOC.map(d=>'<div class="doc"><div class="av">'+ini(d.n)+'</div><b>'+d.n+'</b><span>'+d.r+'</span></div>').join('')+'</div>'+
  '<section class="loc-card"><div class="loc-head"><b>Visit Our Clinic</b><span class="open-pill">Open Today</span></div><p>'+esc(CLINIC_CONFIG.address)+'<br>'+esc(CLINIC_CONFIG.timings)+'</p><div class="loc-actions"><a class="btn solid" href="'+esc(CLINIC_CONFIG.mapUrl)+'" target="_blank" rel="noopener">Get Directions</a><a class="btn ghost" href="tel:'+CLINIC_CONFIG.phone+'">Call Now</a></div></section>'+
  '<div class="tip"><b>Tip for today</b>'+TIPS[new Date().getDate()%TIPS.length]+'</div>';
}

function barContent() {
  const b = st.b, dayN = addDays(b.day);
  if (isBookingReady()) return { title: sv(b.s).n, sub: fmtD(dayN) + ', ' + fmtT(b.t), ready: true };
  if (b.s && b.d && b.t) return { title: 'Enter your details', sub: 'Add name & 10-digit phone number', ready: false };
  return { title: 'Almost there', sub: 'Choose treatment, dentist & time', ready: false };
}

function book() {
  const b = st.b;
  let days = '';
  for (let i=0; i<8; i++) {
    const d = addDays(i);
    days += '<button class="day" data-a="day" data-n="'+i+'" aria-pressed="'+(b.day===i)+'"><small>'+d.toLocaleDateString('en-IN',{weekday:'short'})+'</small><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString('en-IN',{month:'short'})+'</small></button>';
  }
  const bc = barContent();
  return '<header class="top"><div><p class="sub">Instant WhatsApp booking</p><h1>Book a visit</h1></div></header>'+
  '<h2>Treatment</h2><div class="chips">'+SVC.map(s=>'<button class="chip" data-a="svc" data-id="'+s.id+'" aria-pressed="'+(b.s===s.id)+'">'+s.n+'</button>').join('')+'</div>'+
  '<h2>Dentist</h2>'+DOC.map(d=>'<button class="pick" data-a="doc" data-id="'+d.id+'" aria-pressed="'+(b.d===d.id)+'"><span class="av">'+ini(d.n)+'</span><span><b>'+d.n+'</b><small>'+d.r+'</small></span></button>').join('')+
  '<h2>Date</h2><div class="days">'+days+'</div>'+
  '<h2>Time</h2><div class="slots">'+TIMES.map(t=>'<button class="slot" data-a="time" data-t="'+t+'" aria-pressed="'+(b.t===t)+'"'+(taken(b.day,t)?' disabled':'')+'>'+fmtT(t)+'</button>').join('')+'</div>'+
  '<h2>Patient details</h2>'+
  '<div class="form-card">'+
    '<div class="field"><label for="p-name">Full Name *</label><input id="p-name" type="text" placeholder="e.g. Rahul Kumar" value="'+esc(b.name)+'" autocomplete="name"></div>'+
    '<div class="field"><label for="p-phone">Phone / WhatsApp Number *</label><input id="p-phone" type="tel" inputmode="numeric" maxlength="15" placeholder="10-digit mobile number" value="'+esc(b.phone)+'" autocomplete="tel"></div>'+
    '<div class="field"><label for="p-note">Problem / Note (Optional)</label><input id="p-note" type="text" placeholder="e.g. Pain in lower right tooth" value="'+esc(b.note)+'"></div>'+
  '</div>'+
  '<div class="bar"><div><b id="bar-title">'+bc.title+'</b><small id="bar-sub">'+bc.sub+'</small></div><button id="confirm-btn" class="btn wa" data-a="confirm"'+(bc.ready?'':' disabled')+'>WhatsApp Book</button></div>';
}

function visits() {
  const card = a => '<article class="visit"><div class="h"><b>'+sv(a.s).n+'</b><span class="tag'+(a.up?'':' done')+'">'+(a.up?'Upcoming':'Completed')+'</span></div><p>'+dc(a.d).n+'<br>'+fmtD(a.date)+', '+fmtT(a.t)+(a.name?'<br>Patient: '+esc(a.name)+' ('+esc(a.phone)+')':'')+'</p><div class="actions">'+
    (a.up
      ? '<button class="btn ghost" data-a="wa-resend" data-id="'+a.id+'">Send on WhatsApp</button><button class="btn ghost danger" data-a="cancel" data-id="'+a.id+'">Cancel</button>'
      : '<button class="btn ghost" data-a="again" data-s="'+a.s+'" data-d="'+a.d+'">Book again</button>')+
  '</div></article>';
  const up = st.appts.filter(a=>a.up).sort((x,y)=>x.date-y.date), past = st.appts.filter(a=>!a.up);
  return '<header class="top"><div><p class="sub">Saved on this device</p><h1>Visits</h1></div></header>'+
  '<h2>Upcoming</h2>'+(up.length?up.map(card).join(''):'<p class="empty">Nothing booked yet.<br><button class="btn solid" data-a="nav" data-v="book">Book a visit</button></p>')+
  '<h2>Past</h2>'+(past.length?past.map(card).join(''):'<p class="empty">No past visits.</p>');
}

function care() {
  const done = st.am && st.pm, week = [1,1,0,1,1,1], n = 4 + (done ? 1 : 0);
  return '<header class="top"><div><p class="sub">Daily routine</p><h1>Care</h1></div></header>'+
  '<div class="streak"><div class="n disp">'+n+'</div><div><b>day brushing streak</b><div class="dots">'+week.map(w=>'<i class="'+(w?'on':'')+'"></i>').join('')+'<i class="'+(done?'on':'')+'"></i></div></div></div>'+
  '<div class="brush"><button data-a="brush" data-k="am" aria-pressed="'+st.am+'"><b>Morning</b>'+(st.am?'Done':'Tap when done')+'</button><button data-a="brush" data-k="pm" aria-pressed="'+st.pm+'"><b>Night</b>'+(st.pm?'Done':'Tap when done')+'</button></div>'+
  '<h2>Healthy habits</h2><ul class="list">'+TIPS.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
}

function render() {
  const V = {home, book, visits, care};
  document.getElementById('app').innerHTML = V[st.v]();
  document.getElementById('nav').innerHTML = NAV.map(n=>'<button data-a="nav" data-v="'+n[0]+'"'+(st.v===n[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n[0]]+'</svg>'+n[1]+'</button>').join('');
}

function syncBar() {
  const btn = document.getElementById('confirm-btn');
  if (!btn) return;
  const bc = barContent();
  document.getElementById('bar-title').textContent = bc.title;
  document.getElementById('bar-sub').textContent = bc.sub;
  btn.disabled = !bc.ready;
}

function go(v) { st.v = v; render(); window.scrollTo(0,0); }

let tt;
function toast(m) {
  const e = document.getElementById('toast');
  e.textContent = m; e.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>e.classList.remove('show'), 2400);
}

document.addEventListener('input', e => {
  if (e.target.id === 'p-name') st.b.name = e.target.value;
  else if (e.target.id === 'p-phone') st.b.phone = e.target.value;
  else if (e.target.id === 'p-note') st.b.note = e.target.value;
  else return;
  syncBar();
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, D = el.dataset;

  if (a === 'nav') go(D.v);
  else if (a === 'quick') { st.b = {s:D.id, d:null, day:1, t:null, name:st.user.name, phone:st.user.phone, note:''}; go('book'); }
  else if (a === 'again') { st.b = {s:D.s, d:D.d, day:1, t:null, name:st.user.name, phone:st.user.phone, note:''}; go('book'); }
  else if (a === 'svc') { st.b.s = D.id; render(); }
  else if (a === 'doc') { st.b.d = D.id; render(); }
  else if (a === 'day') { st.b.day = +D.n; st.b.t = null; render(); }
  else if (a === 'time') { st.b.t = D.t; render(); }
  else if (a === 'confirm') {
    if (!isBookingReady()) return;
    const b = st.b;
    const appt = {
      id: ++st.id, s: b.s, d: b.d, date: addDays(b.day), t: b.t, up: true,
      name: b.name.trim(), phone: b.phone.trim(), note: b.note.trim()
    };
    st.user = { name: appt.name, phone: appt.phone };
    st.appts.push(appt);
    st.b = { s:null, d:null, day:1, t:null, name:st.user.name, phone:st.user.phone, note:'' };
    saveState();
    openWhatsApp(appt);
    go('visits');
    toast('Saved! Opening WhatsApp...');
  }
  else if (a === 'wa-resend') {
    const appt = st.appts.find(x => x.id === +D.id);
    if (appt) openWhatsApp(appt);
  }
  else if (a === 'cancel') {
    st.appts = st.appts.filter(x => x.id !== +D.id);
    saveState(); render(); toast('Visit cancelled');
  }
  else if (a === 'brush') {
    st[D.k] = !st[D.k]; saveState(); render();
  }
});

render();
</script>
</body>
</html>
